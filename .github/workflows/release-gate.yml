name: release-gate
on:
  pull_request:
  push:
    branches: [main]
jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required files
        run: |
          test -f index.html && test -f assets/css/styles.css && test -f assets/js/app.js && test -f assets/js/converters.js
          test -f assets/js/heic-to-jpg.js && test -f heic-to-jpg/index.html && test -f tests/heic-browser-smoke.mjs
          test -f assets/js/png-to-jpg.js && test -f png-to-jpg/index.html && test -f tests/png-to-jpg-browser-smoke.mjs
          test -f assets/js/jpg-to-png.js && test -f jpg-to-png/index.html && test -f tests/jpg-to-png-browser-smoke.mjs
          test -f assets/js/webp-to-jpg.js && test -f webp-to-jpg/index.html && test -f tests/webp-to-jpg-browser-smoke.mjs
          test -f assets/js/webp-to-png.js && test -f webp-to-png/index.html && test -f tests/webp-to-png-browser-smoke.mjs
          test -f assets/js/jpg-to-webp.js && test -f jpg-to-webp/index.html && test -f tests/jpg-to-webp-browser-smoke.mjs
          test -f assets/js/heic-libheif-bootstrap.mjs && test -f assets/vendor/libheif/libheif-bundle.mjs && test -f privacy/index.html && test -f robots.txt && test -f sitemap.xml && test -f _headers
      - name: Check JavaScript syntax
        run: |
          node --check assets/js/app.js && node --check assets/js/converters.js
          node --check assets/js/heic-to-jpg.js && node --check assets/js/heic-libheif-bootstrap.mjs && node --check tests/heic-browser-smoke.mjs
          node --check assets/js/png-to-jpg.js && node --check tests/png-to-jpg-browser-smoke.mjs
          node --check assets/js/jpg-to-png.js && node --check tests/jpg-to-png-browser-smoke.mjs
          node --check assets/js/webp-to-jpg.js && node --check tests/webp-to-jpg-browser-smoke.mjs
          node --check assets/js/webp-to-png.js && node --check tests/webp-to-png-browser-smoke.mjs
          node --check assets/js/jpg-to-webp.js && node --check tests/jpg-to-webp-browser-smoke.mjs
      - name: Check JPG to WebP wiring
        run: |
          grep -q 'jpg-to-webp' assets/js/converters.js
          grep -q 'convertfiletype.com/jpg-to-webp/' sitemap.xml
          grep -q 'data-jpg-file' jpg-to-webp/index.html
          grep -q '/assets/js/jpg-to-webp.js?v=1' jpg-to-webp/index.html
          grep -q 'Converter build: jpg-webp-v1-native' jpg-to-webp/index.html
          ! grep -q '<script type="module">' jpg-to-webp/index.html
          grep -q 'image/webp' assets/js/jpg-to-webp.js
          grep -q 'toBlob' assets/js/jpg-to-webp.js
          grep -q 'CONVERSION_TIMEOUT_MS=10000' assets/js/jpg-to-webp.js
          grep -q 'Generated WebP signature is invalid' assets/js/jpg-to-webp.js
          grep -q "Reading JPG file" assets/js/jpg-to-webp.js
          grep -q "Decoding JPG" assets/js/jpg-to-webp.js
          grep -q "Encoding WebP" assets/js/jpg-to-webp.js
          grep -q "Validating WebP" assets/js/jpg-to-webp.js
      - name: Check JPG to WebP browser gate
        run: |
          grep -q 'jpg-webp-v1-native' tests/jpg-to-webp-browser-smoke.mjs
          grep -q 'image/webp' tests/jpg-to-webp-browser-smoke.mjs
          grep -q "RIFF" tests/jpg-to-webp-browser-smoke.mjs
          grep -q "WEBP" tests/jpg-to-webp-browser-smoke.mjs
          grep -q 'elapsed<10000' tests/jpg-to-webp-browser-smoke.mjs
      - name: Check existing converter regressions remain wired
        run: |
          test -f .github/workflows/heic-browser-smoke.yml && test -f .github/workflows/png-to-jpg-browser-smoke.yml && test -f .github/workflows/jpg-to-png-browser-smoke.yml && test -f .github/workflows/webp-to-jpg-browser-smoke.yml && test -f .github/workflows/webp-to-png-browser-smoke.yml
          grep -q 'heic-v14-csp-safe' heic-to-jpg/index.html && grep -q 'png-v1-native' png-to-jpg/index.html && grep -q 'jpg-png-v1-native' jpg-to-png/index.html && grep -q 'webp-jpg-v1-native' webp-to-jpg/index.html && grep -q 'webp-png-v1-native' webp-to-png/index.html
      - name: Check security policy
        run: |
          ! grep -q 'cdn.jsdelivr.net' _headers
          grep -q "script-src 'self' 'wasm-unsafe-eval'" _headers
          grep -q "connect-src 'self'" _headers
          grep -q "worker-src 'self' blob:" _headers
