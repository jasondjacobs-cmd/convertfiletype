name: release-gate
on:
  pull_request:
  push:
    branches: [main]
jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required files
        run: |
          test -f index.html && test -f assets/css/styles.css && test -f assets/js/app.js && test -f assets/js/converters.js
          test -f assets/js/heic-to-jpg.js && test -f heic-to-jpg/index.html && test -f tests/heic-browser-smoke.mjs
          test -f assets/js/heic-to-png.js && test -f heic-to-png/index.html && test -f tests/heic-to-png-browser-smoke.mjs
          test -f assets/js/png-to-jpg.js && test -f png-to-jpg/index.html && test -f tests/png-to-jpg-browser-smoke.mjs
          test -f assets/js/jpg-to-png.js && test -f jpg-to-png/index.html && test -f tests/jpg-to-png-browser-smoke.mjs
          test -f assets/js/webp-to-jpg.js && test -f webp-to-jpg/index.html && test -f tests/webp-to-jpg-browser-smoke.mjs
          test -f assets/js/webp-to-png.js && test -f webp-to-png/index.html && test -f tests/webp-to-png-browser-smoke.mjs
          test -f assets/js/webp-to-avif.mjs && test -f webp-to-avif/index.html && test -f tests/webp-to-avif-browser-smoke.mjs
          test -f assets/js/jpg-to-webp.js && test -f jpg-to-webp/index.html && test -f tests/jpg-to-webp-browser-smoke.mjs
          test -f assets/js/png-to-webp.js && test -f png-to-webp/index.html && test -f tests/png-to-webp-browser-smoke.mjs
          test -f assets/js/avif-to-jpg.js && test -f avif-to-jpg/index.html && test -f tests/avif-to-jpg-browser-smoke.mjs
          test -f assets/js/avif-to-png.js && test -f avif-to-png/index.html && test -f tests/avif-to-png-browser-smoke.mjs
          test -f assets/js/avif-to-webp.js && test -f avif-to-webp/index.html && test -f tests/avif-to-webp-browser-smoke.mjs
          test -f assets/js/jpg-to-avif.mjs && test -f assets/js/avif-encoder.mjs && test -f jpg-to-avif/index.html && test -f tests/jpg-to-avif-browser-smoke.mjs
          test -f assets/js/png-to-avif.mjs && test -f png-to-avif/index.html && test -f tests/png-to-avif-browser-smoke.mjs
          test -f assets/vendor/jsquash-avif/avif_enc.js && test -f assets/vendor/jsquash-avif/avif_enc.wasm && test -f assets/vendor/jsquash-avif/LICENSE && test -f assets/vendor/jsquash-avif/NOTICE.md
          test -f assets/js/heic-libheif-bootstrap.mjs && test -f assets/vendor/libheif/libheif-bundle.mjs && test -f privacy/index.html && test -f robots.txt && test -f sitemap.xml && test -f _headers
      - name: Check JavaScript syntax
        run: |
          node --check assets/js/app.js && node --check assets/js/converters.js
          node --check assets/js/heic-to-jpg.js && node --check assets/js/heic-libheif-bootstrap.mjs && node --check tests/heic-browser-smoke.mjs
          node --check assets/js/heic-to-png.js && node --check tests/heic-to-png-browser-smoke.mjs
          node --check assets/js/png-to-jpg.js && node --check tests/png-to-jpg-browser-smoke.mjs
          node --check assets/js/jpg-to-png.js && node --check tests/jpg-to-png-browser-smoke.mjs
          node --check assets/js/webp-to-jpg.js && node --check tests/webp-to-jpg-browser-smoke.mjs
          node --check assets/js/webp-to-png.js && node --check tests/webp-to-png-browser-smoke.mjs
          node --check assets/js/webp-to-avif.mjs && node --check tests/webp-to-avif-browser-smoke.mjs
          node --check assets/js/jpg-to-webp.js && node --check tests/jpg-to-webp-browser-smoke.mjs
          node --check assets/js/png-to-webp.js && node --check tests/png-to-webp-browser-smoke.mjs
          node --check assets/js/avif-to-jpg.js && node --check tests/avif-to-jpg-browser-smoke.mjs
          node --check assets/js/avif-to-png.js && node --check tests/avif-to-png-browser-smoke.mjs
          node --check assets/js/avif-to-webp.js && node --check tests/avif-to-webp-browser-smoke.mjs
          node --check assets/js/avif-encoder.mjs && node --check assets/js/jpg-to-avif.mjs && node --check tests/jpg-to-avif-browser-smoke.mjs
          node --check assets/js/png-to-avif.mjs && node --check tests/png-to-avif-browser-smoke.mjs
      - name: Check HEIC to PNG wiring
        run: |
          grep -q 'heic-to-png' assets/js/converters.js
          grep -q 'convertfiletype.com/heic-to-png/' sitemap.xml
          grep -q 'data-heic-file' heic-to-png/index.html
          grep -q 'Converter build: heic-png-v1-libheif' heic-to-png/index.html
          grep -q '/assets/js/heic-libheif-bootstrap.mjs?v=14' heic-to-png/index.html
          grep -q '/assets/js/heic-to-png.js?v=1' heic-to-png/index.html
          grep -q 'PNG_SIGNATURE = \[137, 80, 78, 71, 13, 10, 26, 10\]' assets/js/heic-to-png.js
          grep -q 'Generated PNG signature is invalid' assets/js/heic-to-png.js
          grep -q 'Generated PNG dimensions do not match the HEIC source' assets/js/heic-to-png.js
          grep -q "getContext('2d', { alpha: true })" assets/js/heic-to-png.js
          grep -q 'context.clearRect' assets/js/heic-to-png.js
      - name: Check HEIC to PNG browser gate
        run: |
          grep -q 'heic-png-v1-libheif' tests/heic-to-png-browser-smoke.mjs
          grep -q 'image/png' tests/heic-to-png-browser-smoke.mjs
          grep -q '137, 80, 78, 71, 13, 10, 26, 10' tests/heic-to-png-browser-smoke.mjs
          grep -q 'libheif-bundle.mjs' tests/heic-to-png-browser-smoke.mjs
          grep -q 'externalHttpRequests' tests/heic-to-png-browser-smoke.mjs
          grep -q 'elapsed < 10000' tests/heic-to-png-browser-smoke.mjs
      - name: Check WebP encoder wiring
        run: |
          grep -q 'jpg-to-webp' assets/js/converters.js
          grep -q 'convertfiletype.com/jpg-to-webp/' sitemap.xml
          grep -q 'Converter build: jpg-webp-v1-native' jpg-to-webp/index.html
          grep -q 'image/webp' assets/js/jpg-to-webp.js
          grep -q 'Generated WebP signature is invalid' assets/js/jpg-to-webp.js
          grep -q 'png-to-webp' assets/js/converters.js
          grep -q 'convertfiletype.com/png-to-webp/' sitemap.xml
          grep -q 'Converter build: png-webp-v1-native' png-to-webp/index.html
          grep -q 'Generated WebP signature is invalid' assets/js/png-to-webp.js
          grep -q 'transparent corner alpha should be preserved' tests/png-to-webp-browser-smoke.mjs
      - name: Check WebP to AVIF wiring
        run: |
          grep -q 'webp-to-avif' assets/js/converters.js
          grep -q 'convertfiletype.com/webp-to-avif/' sitemap.xml
          grep -q 'data-webp-file' webp-to-avif/index.html
          grep -q 'Converter build: webp-avif-v1-wasm' webp-to-avif/index.html
          grep -q '/assets/js/webp-to-avif.mjs?v=1' webp-to-avif/index.html
          grep -q 'Generated AVIF signature is invalid' assets/js/webp-to-avif.mjs
          grep -q 'Generated AVIF dimensions do not match the WebP source' assets/js/webp-to-avif.mjs
          grep -q 'CONVERSION_TIMEOUT_MS = 10000' assets/js/webp-to-avif.mjs
          grep -q 'ctx.clearRect' assets/js/webp-to-avif.mjs
      - name: Check WebP to AVIF browser gate
        run: |
          grep -q 'webp-avif-v1-wasm' tests/webp-to-avif-browser-smoke.mjs
          grep -q 'image/avif' tests/webp-to-avif-browser-smoke.mjs
          grep -q "result.box, 'ftyp'" tests/webp-to-avif-browser-smoke.mjs
          grep -q 'transparent corner alpha should be preserved' tests/webp-to-avif-browser-smoke.mjs
          grep -q 'opaque center alpha should remain opaque' tests/webp-to-avif-browser-smoke.mjs
          grep -q 'avif_enc.wasm' tests/webp-to-avif-browser-smoke.mjs
          grep -q 'externalHttpRequests' tests/webp-to-avif-browser-smoke.mjs
          grep -q 'elapsed < 10000' tests/webp-to-avif-browser-smoke.mjs
      - name: Check AVIF to JPG wiring
        run: |
          grep -q 'avif-to-jpg' assets/js/converters.js
          grep -q 'convertfiletype.com/avif-to-jpg/' sitemap.xml
          grep -q 'Converter build: avif-jpg-v1-native' avif-to-jpg/index.html
          grep -q 'AVIF_PROBE' assets/js/avif-to-jpg.js
          grep -q 'Generated JPG signature is invalid' assets/js/avif-to-jpg.js
      - name: Check AVIF to PNG wiring
        run: |
          grep -q 'avif-to-png' assets/js/converters.js
          grep -q 'convertfiletype.com/avif-to-png/' sitemap.xml
          grep -q 'data-avif-file' avif-to-png/index.html
          grep -q '/assets/js/avif-to-png.js?v=1' avif-to-png/index.html
          grep -q 'Converter build: avif-png-v1-native' avif-to-png/index.html
          ! grep -q '<script type="module">' avif-to-png/index.html
          grep -q 'AVIF_PROBE' assets/js/avif-to-png.js
          grep -q 'detectAvifSupport' assets/js/avif-to-png.js
          grep -q 'image/png' assets/js/avif-to-png.js
          grep -q 'CONVERSION_TIMEOUT_MS = 10000' assets/js/avif-to-png.js
          grep -q 'Generated PNG signature is invalid' assets/js/avif-to-png.js
          grep -q 'Generated PNG dimensions do not match the AVIF source' assets/js/avif-to-png.js
          grep -q 'Reading AVIF file' assets/js/avif-to-png.js
          grep -q 'Decoding AVIF' assets/js/avif-to-png.js
          grep -q 'Encoding PNG' assets/js/avif-to-png.js
          grep -q 'Validating PNG' assets/js/avif-to-png.js
      - name: Check AVIF to PNG browser gate
        run: |
          grep -q 'avif-png-v1-native' tests/avif-to-png-browser-smoke.mjs
          grep -q 'image/png' tests/avif-to-png-browser-smoke.mjs
          grep -q '137, 80, 78, 71, 13, 10, 26, 10' tests/avif-to-png-browser-smoke.mjs
          grep -q 'transparent corner alpha should be preserved' tests/avif-to-png-browser-smoke.mjs
          grep -q 'elapsed < 10000' tests/avif-to-png-browser-smoke.mjs
      - name: Check AVIF to WebP wiring
        run: |
          grep -q 'avif-to-webp' assets/js/converters.js
          grep -q 'convertfiletype.com/avif-to-webp/' sitemap.xml
          grep -q 'data-avif-file' avif-to-webp/index.html
          grep -q 'Converter build: avif-webp-v1-native' avif-to-webp/index.html
          grep -q '/assets/js/avif-to-webp.js?v=1' avif-to-webp/index.html
          grep -q 'AVIF_PROBE' assets/js/avif-to-webp.js
          grep -q 'detectAvifSupport' assets/js/avif-to-webp.js
          grep -q 'image/webp' assets/js/avif-to-webp.js
          grep -q 'Generated WebP signature is invalid' assets/js/avif-to-webp.js
          grep -q 'Generated WebP dimensions do not match the AVIF source' assets/js/avif-to-webp.js
          grep -q 'CONVERSION_TIMEOUT_MS = 10000' assets/js/avif-to-webp.js
      - name: Check AVIF to WebP browser gate
        run: |
          grep -q 'avif-webp-v1-native' tests/avif-to-webp-browser-smoke.mjs
          grep -q 'image/webp' tests/avif-to-webp-browser-smoke.mjs
          grep -q "output.signature.startsWith('RIFF')" tests/avif-to-webp-browser-smoke.mjs
          grep -q "output.signature.slice(8, 12), 'WEBP'" tests/avif-to-webp-browser-smoke.mjs
          grep -q 'transparent corner alpha should be preserved' tests/avif-to-webp-browser-smoke.mjs
          grep -q 'opaque center alpha should remain opaque' tests/avif-to-webp-browser-smoke.mjs
          grep -q 'externalHttpRequests' tests/avif-to-webp-browser-smoke.mjs
          grep -q 'elapsed < 10000' tests/avif-to-webp-browser-smoke.mjs
      - name: Check JPG to AVIF wiring
        run: |
          grep -q 'jpg-to-avif' assets/js/converters.js
          grep -q 'convertfiletype.com/jpg-to-avif/' sitemap.xml
          grep -q 'Converter build: jpg-avif-v1-wasm' jpg-to-avif/index.html
          grep -q '/assets/js/jpg-to-avif.mjs?v=1' jpg-to-avif/index.html
          grep -q "type=\"module\"" jpg-to-avif/index.html
          grep -q '/assets/vendor/jsquash-avif/avif_enc.js' assets/js/avif-encoder.mjs
          grep -q '/assets/vendor/jsquash-avif/avif_enc.wasm' assets/js/avif-encoder.mjs
          grep -q 'Generated AVIF signature is invalid' assets/js/jpg-to-avif.mjs
          grep -q 'Generated AVIF dimensions do not match the JPG source' assets/js/jpg-to-avif.mjs
          grep -q 'CONVERSION_TIMEOUT_MS = 10000' assets/js/jpg-to-avif.mjs
          test "$(git hash-object assets/vendor/jsquash-avif/avif_enc.js)" = "8ab70b90bbaec1e8764dfbb9fefd6d868b3eafe3"
          test "$(git hash-object assets/vendor/jsquash-avif/avif_enc.wasm)" = "4c3da3f2ceb0e3a5a1337c48e15f89b0a46c7ff8"
          test "$(git hash-object assets/vendor/jsquash-avif/LICENSE)" = "64bfa05ff7ec68de204c1de2c47901a52cc9bd45"
      - name: Check JPG to AVIF browser gate
        run: |
          grep -q 'jpg-avif-v1-wasm' tests/jpg-to-avif-browser-smoke.mjs
          grep -q 'image/avif' tests/jpg-to-avif-browser-smoke.mjs
          grep -q "result.box, 'ftyp'" tests/jpg-to-avif-browser-smoke.mjs
          grep -q 'avif_enc.wasm' tests/jpg-to-avif-browser-smoke.mjs
          grep -q 'externalHttpRequests' tests/jpg-to-avif-browser-smoke.mjs
          grep -q 'elapsed < 10000' tests/jpg-to-avif-browser-smoke.mjs
      - name: Check PNG to AVIF wiring
        run: |
          grep -q 'png-to-avif' assets/js/converters.js
          grep -q 'convertfiletype.com/png-to-avif/' sitemap.xml
          grep -q 'data-png-file' png-to-avif/index.html
          grep -q 'Converter build: png-avif-v1-wasm' png-to-avif/index.html
          grep -q '/assets/js/png-to-avif.mjs?v=1' png-to-avif/index.html
          grep -q "type=\"module\"" png-to-avif/index.html
          grep -q 'Generated AVIF signature is invalid' assets/js/png-to-avif.mjs
          grep -q 'Generated AVIF dimensions do not match the PNG source' assets/js/png-to-avif.mjs
          grep -q 'CONVERSION_TIMEOUT_MS = 10000' assets/js/png-to-avif.mjs
          grep -q 'ctx.clearRect' assets/js/png-to-avif.mjs
      - name: Check PNG to AVIF browser gate
        run: |
          grep -q 'png-avif-v1-wasm' tests/png-to-avif-browser-smoke.mjs
          grep -q 'image/avif' tests/png-to-avif-browser-smoke.mjs
          grep -q "result.box, 'ftyp'" tests/png-to-avif-browser-smoke.mjs
          grep -q 'transparent corner alpha should be preserved' tests/png-to-avif-browser-smoke.mjs
          grep -q 'opaque center alpha should remain opaque' tests/png-to-avif-browser-smoke.mjs
          grep -q 'avif_enc.wasm' tests/png-to-avif-browser-smoke.mjs
          grep -q 'externalHttpRequests' tests/png-to-avif-browser-smoke.mjs
          grep -q 'elapsed < 10000' tests/png-to-avif-browser-smoke.mjs
      - name: Check existing converter regressions remain wired
        run: |
          test -f .github/workflows/heic-browser-smoke.yml
          test -f .github/workflows/heic-to-png-browser-smoke.yml
          test -f .github/workflows/png-to-jpg-browser-smoke.yml
          test -f .github/workflows/jpg-to-png-browser-smoke.yml
          test -f .github/workflows/webp-to-jpg-browser-smoke.yml
          test -f .github/workflows/webp-to-png-browser-smoke.yml
          test -f .github/workflows/webp-to-avif-browser-smoke.yml
          test -f .github/workflows/jpg-to-webp-browser-smoke.yml
          test -f .github/workflows/png-to-webp-browser-smoke.yml
          test -f .github/workflows/avif-to-jpg-browser-smoke.yml
          test -f .github/workflows/avif-to-png-browser-smoke.yml
          test -f .github/workflows/avif-to-webp-browser-smoke.yml
          test -f .github/workflows/jpg-to-avif-browser-smoke.yml
          test -f .github/workflows/png-to-avif-browser-smoke.yml
          grep -q 'heic-v14-csp-safe' heic-to-jpg/index.html
          grep -q 'heic-png-v1-libheif' heic-to-png/index.html
          grep -q 'png-v1-native' png-to-jpg/index.html
          grep -q 'jpg-png-v1-native' jpg-to-png/index.html
          grep -q 'webp-jpg-v1-native' webp-to-jpg/index.html
          grep -q 'webp-png-v1-native' webp-to-png/index.html
          grep -q 'webp-avif-v1-wasm' webp-to-avif/index.html
          grep -q 'jpg-webp-v1-native' jpg-to-webp/index.html
          grep -q 'png-webp-v1-native' png-to-webp/index.html
          grep -q 'avif-jpg-v1-native' avif-to-jpg/index.html
          grep -q 'avif-png-v1-native' avif-to-png/index.html
          grep -q 'avif-webp-v1-native' avif-to-webp/index.html
          grep -q 'jpg-avif-v1-wasm' jpg-to-avif/index.html
          grep -q 'png-avif-v1-wasm' png-to-avif/index.html
      - name: Check security policy
        run: |
          ! grep -q 'cdn.jsdelivr.net' _headers
          grep -q "script-src 'self' 'wasm-unsafe-eval'" _headers
          grep -q "connect-src 'self'" _headers
          grep -q "worker-src 'self' blob:" _headers
