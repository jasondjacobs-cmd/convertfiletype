name: vendor-libheif-v3

on:
  push:
    branches:
      - fix/heic-decoder-v3

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/heic-decoder-v3
      - name: Vendor libheif bundle
        run: |
          mkdir -p assets/vendor/libheif
          if [ -f assets/vendor/libheif/libheif-bundle.mjs ]; then
            echo "libheif bundle already vendored"
            exit 0
          fi
          curl -L --fail https://cdn.jsdelivr.net/npm/libheif-js@1.23.2/libheif-wasm/libheif-bundle.mjs -o assets/vendor/libheif/libheif-bundle.mjs
          test -s assets/vendor/libheif/libheif-bundle.mjs
          grep -q "HeifDecoder" assets/vendor/libheif/libheif-bundle.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/vendor/libheif/libheif-bundle.mjs
          git commit -m "vendor: self-host libheif wasm bundle"
          git push origin HEAD:fix/heic-decoder-v3
