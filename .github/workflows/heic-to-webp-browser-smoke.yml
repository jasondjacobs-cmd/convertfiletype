name: heic-to-webp-browser-smoke

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install browser test dependency
        run: |
          npm init -y
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Fetch HEIC test fixture
        run: curl -L --fail https://raw.githubusercontent.com/tigranbs/test-heic-images/master/image1.heic -o /tmp/image1.heic
      - name: Start site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/site.log 2>&1 &
          sleep 2
      - name: Run HEIC to WebP browser smoke
        env:
          HEIC_FIXTURE: /tmp/image1.heic
          SITE_URL: http://127.0.0.1:4173
        run: node tests/heic-to-webp-browser-smoke.mjs
