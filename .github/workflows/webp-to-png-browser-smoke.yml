name: webp-to-png-browser-smoke

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: python3 -m http.server 4173 >/tmp/convertfiletype-http.log 2>&1 &
      - run: node tests/webp-to-png-browser-smoke.mjs
        env:
          SITE_URL: http://127.0.0.1:4173
