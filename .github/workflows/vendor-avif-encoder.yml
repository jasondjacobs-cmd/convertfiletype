name: vendor-avif-encoder
on:
  push:
    branches: [feature/jpg-to-avif-v1]
permissions:
  contents: write
jobs:
  vendor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vendor pinned jSquash AVIF encoder
        run: |
          set -euo pipefail
          JSQUASH_SHA=da47a2be3b302beb5a5ae164a2ab7aa21a041d90
          DEST=assets/vendor/jsquash-avif
          mkdir -p "$DEST"
          curl -fsSL "https://raw.githubusercontent.com/jamsinclair/jSquash/${JSQUASH_SHA}/packages/avif/codec/enc/avif_enc.js" -o "$DEST/avif_enc.js"
          curl -fsSL "https://raw.githubusercontent.com/jamsinclair/jSquash/${JSQUASH_SHA}/packages/avif/codec/enc/avif_enc.wasm" -o "$DEST/avif_enc.wasm"
          curl -fsSL "https://raw.githubusercontent.com/jamsinclair/jSquash/${JSQUASH_SHA}/LICENSE" -o "$DEST/LICENSE"
          test "$(git hash-object "$DEST/avif_enc.js")" = "8ab70b90bbaec1e8764dfbb9fefd6d868b3eafe3"
          test "$(git hash-object "$DEST/avif_enc.wasm")" = "4c3da3f2ceb0e3a5a1337c48e15f89b0a46c7ff8"
          test "$(git hash-object "$DEST/LICENSE")" = "64bfa05ff7ec68de204c1de2c47901a52cc9bd45"
          cat > "$DEST/NOTICE.md" <<'EOF'
          # jSquash AVIF encoder vendoring notice

          Source: https://github.com/jamsinclair/jSquash
          Pinned commit: da47a2be3b302beb5a5ae164a2ab7aa21a041d90
          Vendored files: packages/avif/codec/enc/avif_enc.js and avif_enc.wasm
          License: Apache-2.0 (see LICENSE in this directory)
          Purpose: same-origin, client-side AVIF encoding for ConvertFileType.
          EOF
      - name: Commit vendored encoder
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/vendor/jsquash-avif
          if git diff --cached --quiet; then
            echo "Vendored encoder already up to date."
            exit 0
          fi
          git commit -m "Vendor pinned AVIF encoder assets"
          git push origin HEAD:feature/jpg-to-avif-v1
