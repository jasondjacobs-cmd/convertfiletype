name: jpg-to-avif-browser-smoke
on:
  pull_request:
  push:
    branches: [main]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Start static server
        run: python3 -m http.server 4173 >/tmp/convertfiletype-server.log 2>&1 &
      - name: Run JPG to AVIF browser smoke
        env:
          SITE_URL: http://127.0.0.1:4173
        run: node tests/jpg-to-avif-browser-smoke.mjs
